<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GUIA TV + OVERLAY + NOTÍCIAS</title>

<style>
html, body {
  width: 100%;
  height: 1080px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent; 
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #fff;
}

/* ==========================================
   WIDGET DE DATA, HORA E CLIMA
   ========================================== */
.widget-moderno {
  position: fixed;
  top: 30px;
  right: 40px;
  display: flex;
  flex-direction: column;
  align-items: flex-end; 
  gap: 4px;
  padding: 15px 25px;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-radius: 20px;
  border: none;
  box-shadow: none;
  z-index: 10000;
}

.widget-moderno .hora {
  font-size: 54px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1;
  text-shadow: 0 0 12px rgba(0,0,0,0.4);
}

.widget-moderno .data-clima {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 22px;
  font-weight: 400;
  opacity: 0.9;
  text-transform: capitalize; 
}

.widget-moderno .clima-grupo {
  display: flex;
  align-items: center;
  gap: 6px;
  border-left: 1px solid rgba(255, 255, 255, 0.3);
  padding-left: 12px;
}

.widget-moderno img {
  width: 36px;
  height: 36px;
  filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
}

/* ==========================================
   CAROUSEL E GUIA DE PROGRAMAÇÃO
   ========================================== */
.carousel-container {
  width: 100%;
  position: fixed;
  bottom: 0;
  left: 0;
  background: transparent !important; 
  backdrop-filter: none !important;    
  padding: 20px 0 10px 0;
  box-sizing: border-box;
  z-index: 9999;
}

.carousel-wrapper {
  overflow: hidden;
  width: calc(100% - 80px); 
  margin: 0 auto;
}

.carousel-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 160px); 
  gap: 18px; 
  width: 100%;
}

.channel {
  height: 160px; 
  background: rgba(20, 20, 20, 0.8); 
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  box-sizing: border-box;
  display: flex;
  flex-direction: row; 
  align-items: center; 
  gap: 18px;                 
}

.logo-container {
  width: 95px; 
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0; 
}

.logo {
  max-width: 100%;
  max-height: 80px;
  object-fit: contain;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.channel-info {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0; 
}

.title {
  font-size: 21px; 
  font-weight: 700;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #fff;
}

.program {
  font-size: 16px; 
  line-height: 1.4;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2; 
  -webkit-box-orient: vertical;
}

.next {
  font-size: 14px; 
  opacity: .85;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.progress {
  height: 5px;
  background: rgba(255, 255, 255, 0.15);
  margin-top: 8px;
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #00c853; 
  border-radius: 10px;
}

.aviso-programacao {
  text-align: center;
  font-size: 16px;
  color: rgba(255, 255, 255, 0.75);
  margin-top: 14px;
  font-weight: 500;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.fonte-tag {
  font-weight: 900;
  color: #00c853;
  margin-left: 4px;
}

/* ==========================================
   ESTILO PARA SLIDE DE NOTÍCIA REGIONAL
   ========================================== */
.noticia-card {
  grid-column: span 3;
  grid-row: span 2;
  height: 338px;
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 20px;
  border: 1px solid rgba(0, 200, 83, 0.6);
  padding: 30px 40px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.noticia-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid rgba(255, 255, 255, 0.1);
  padding-bottom: 12px;
}

.noticia-tag {
  background: #00c853;
  color: #000;
  font-weight: 800;
  padding: 6px 16px;
  border-radius: 30px;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.noticia-cidade {
  font-size: 18px;
  color: #94a3b8;
  font-weight: 600;
}

.noticia-titulo {
  font-size: 26px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.3;
  margin: 15px 0 10px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.noticia-resumo {
  font-size: 17px;
  color: #cbd5e1;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.noticia-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  color: #64748b;
  margin-top: 10px;
}

.noticia-fonte {
  color: #38bdf8;
  font-weight: 600;
}
</style>
</head>

// CARREGADOR DE EPG COM RASTREIO DE FONTE E OTIMIZAÇÃO DE MEMÓRIA
// ============================================================================
let epgData = {};

function converterDataXML(dataStr) {
  if (!dataStr || dataStr.length < 14) return null;
  const ano = parseInt(dataStr.substr(0, 4));
  const mes = parseInt(dataStr.substr(4, 2)) - 1;
  const dia = parseInt(dataStr.substr(6, 2));
  const hora = parseInt(dataStr.substr(8, 2));
  const min = parseInt(dataStr.substr(10, 2));
  const seg = parseInt(dataStr.substr(12, 2));
  return new Date(Date.UTC(ano, mes, dia, hora, min, seg));
}

async function baixarEPG() {
  epgData = {}; // Limpeza preventiva de memória antes de recarregar

  for (const fonte of EPG_URLS) {
    try {
      const resp = await fetch(fonte.url);
      const xmlTexto = await resp.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlTexto, "text/xml");
      const programas = xmlDoc.getElementsByTagName("programme");

      for (let p of programas) {
        const channelId = p.getAttribute("channel");
        const start = converterDataXML(p.getAttribute("start"));
        const stop = converterDataXML(p.getAttribute("stop"));
        const titleEl = p.getElementsByTagName("title")[0];
        const title = titleEl ? titleEl.textContent : "Sem Título";

        if (!epgData[channelId]) epgData[channelId] = [];
        epgData[channelId].push({ start, stop, title, fonteTag: fonte.tag });
      }
    } catch (e) {
      console.log("Erro ao carregar fonte EPG: " + fonte.url);
    }
  }
}

function obterProgramaAtual(canal) {
  const agora = new Date();
  let programasDoCanal = [];

  for (let id of canal.id) {
    if (epgData[id]) {
      programasDoCanal = epgData[id];
      break;
    }
  }

  if (programasDoCanal.length === 0) return null;

  let atual = null;
  let proximo = null;

  for (let i = 0; i < programasDoCanal.length; i++) {
    const prog = programasDoCanal[i];
    if (agora >= prog.start && agora < prog.stop) {
      atual = prog;
      proximo = programasDoCanal[i + 1] || null;
      break;
    }
  }

  return { atual, proximo };
}

baixarEPG();
setInterval(baixarEPG, 1800000);

  { url: "https://g1.globo.com/rss/g1/sao-paulo/", cidade: "São Paulo / SP", fonte: "G1 SP" },

function limparHTML(html) {
  const tempDiv = document.createElement("div");
  tempDiv.innerHTML = html;
  return (tempDiv.textContent || tempDiv.innerText || "").trim();
}

async function carregarFeed(fonteObj) {
  try {
    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(fonteObj.url)}`);
    const data = await res.json();
    if (data && data.status === 'ok' && data.items && data.items.length > 0) {
      return data.items.slice(0, 5).map(item => ({
        cidade: fonteObj.cidade,
        titulo: item.title,
        resumo: limparHTML(item.description || item.content),
        fonte: fonteObj.fonte
      }));
    }
  } catch (e) {}

  try {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(fonteObj.url)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    if (data && data.contents) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(data.contents, "text/xml");
      const items = xmlDoc.querySelectorAll("item");
      const result = [];
      items.forEach((item, index) => {
        if (index < 5) {
          const title = item.querySelector("title") ? item.querySelector("title").textContent : "";
          const desc = item.querySelector("description") ? item.querySelector("description").textContent : "";
          if (title) {
            result.push({
              cidade: fonteObj.cidade,
              titulo: title,
              resumo: limparHTML(desc),
              fonte: fonteObj.fonte
            });
          }
        }
      });
      if (result.length > 0) return result;
    }
  } catch (e) {}

  return null;
}

async function atualizarNoticiasRSS() {
  let novasNoticias = [];
  for (const fonte of FONTES_RSS) {
    const noticias = await carregarFeed(fonte);
    if (noticias && noticias.length > 0) {
      novasNoticias = novasNoticias.concat(noticias);
    }
  }
  if (novasNoticias.length > 0) {
    noticiasRegionais = novasNoticias;
  }
}

let paginaAtual = 0;
const itensPorPagina = 6; 
let contadorExibicao = 0;
let indiceNoticiaAtual = 0;

function formatarHora(dateObj) {
  if (!dateObj) return "--:--";
  return dateObj.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
}

function renderizarCarrossel() {
  const container = document.getElementById("carousel");
  const avisoElemento = document.getElementById("aviso-texto");
  if (!container) return;

  const totalPaginasCanais = Math.ceil(canais.length / itensPorPagina);

  if (contadorExibicao > 0 && contadorExibicao % 2 === 0) {
    renderizarNoticia(container);
    if(avisoElemento) {
      avisoElemento.innerHTML = `* A programação dos canais é de responsabilidade das emissoras e está sujeita a alterações sem aviso prévio.`;
    }
    contadorExibicao = 0; 
    return;
  }

  container.innerHTML = "";
  const inicio = paginaAtual * itensPorPagina;
  const fim = inicio + itensPorPagina;
  const canaisPagina = canais.slice(inicio, fim);
  
  let ultimaTagFonteUsada = "."; 

  canaisPagina.forEach(canal => {
    const infoProg = obterProgramaAtual(canal);
    let tituloProg = "Programação Indisponível";
    let proximoProg = "Próximo: --:--";
    let progressoPercent = 0;

    if (infoProg && infoProg.atual) {
      tituloProg = infoProg.atual.title;
      ultimaTagFonteUsada = infoProg.atual.fonteTag || ".";
      const agora = new Date();
      const duracaoTotal = infoProg.atual.stop - infoProg.atual.start;
      const decorrido = agora - infoProg.atual.start;
      progressoPercent = Math.min(100, Math.max(0, (decorrido / duracaoTotal) * 100));

      if (infoProg.proximo) {
        proximoProg = `Próximo: ${formatarHora(infoProg.proximo.start)} ${infoProg.proximo.title}`;
      }
    }

    const div = document.createElement("div");
    div.className = "channel";
    div.innerHTML = `
      <div class="logo-container">
        <img class="logo" src="${canal.logo}" alt="${canal.nome}" onerror="this.src='https://via.placeholder.com/95x60?text=TV'">
      </div>
      <div class="channel-info">
        <div class="title">${canal.num} - ${canal.nome}</div>
        <div class="program">${tituloProg}</div>
        <div class="next">${proximoProg}</div>
        <div class="progress"><div class="bar" style="width: ${progressoPercent}%"></div></div>
      </div>
    `;
    container.appendChild(div);
  });

  if(avisoElemento) {
    avisoElemento.innerHTML = `* A programação dos canais é de responsabilidade das emissoras e está sujeita a alterações sem aviso prévio<span class="fonte-tag">${ultimaTagFonteUsada}</span>`;
  }

  paginaAtual = (paginaAtual + 1) % totalPaginasCanais;
  contadorExibicao++;
}

function renderizarNoticia(container) {
  if (!noticiasRegionais || noticiasRegionais.length === 0) return;

  const noticia = noticiasRegionais[indiceNoticiaAtual];
  
  container.innerHTML = `
    <div class="noticia-card">
      <div class="noticia-header">
        <span class="noticia-tag">ÚLTIMAS NOTÍCIAS</span>
        <span class="noticia-cidade">${noticia.cidade}</span>
      </div>
      <div>
        <div class="noticia-titulo">${noticia.titulo}</div>
        <div class="noticia-resumo">${noticia.resumo}</div>
      </div>
      <div class="noticia-footer">
        <span>Fonte: <strong class="noticia-fonte">${noticia.fonte}</strong></span>
        <span>Informação em tempo real</span>
      </div>
    </div>
  `;

  indiceNoticiaAtual = (indiceNoticiaAtual + 1) % noticiasRegionais.length;
}

renderizarCarrossel();
setInterval(renderizarCarrossel, 8000);

/* ===== DATA E HORA ===== */
function atualizarWidgetHorario() {
  const agora = new Date();
  const hElement = document.getElementById("hora");
  if(hElement) {
    hElement.innerText = agora.toLocaleTimeString("pt-BR", {
      timeZone: "America/Sao_Paulo",
      hour: "2-digit",
      minute: "2-digit"
    });
  }
  const dElement = document.getElementById("data");
  if(dElement) {
    const opcoes = { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Sao_Paulo' };
    dElement.innerText = agora.toLocaleDateString("pt-BR", opcoes);
  }
}
setInterval(atualizarWidgetHorario, 1000);
atualizarWidgetHorario();

/* ===== CLIMA E ÍCONE AUTOMÁTICO (API V2) ===== */
function obterIconeClima(code, isDay) {
  const prefixoHora = isDay ? "d" : "n";
  
  if (code === 0) return `https://openweathermap.org/img/wn/01${prefixoHora}@2x.png`;
  if (code === 1 || code === 2) return `https://openweathermap.org/img/wn/02${prefixoHora}@2x.png`;
  if (code === 3) return `https://openweathermap.org/img/wn/04${prefixoHora}@2x.png`;
  if (code >= 45 && code <= 48) return `https://openweathermap.org/img/wn/50${prefixoHora}@2x.png`;
  if (code >= 51 && code <= 57) return `https://openweathermap.org/img/wn/09d@2x.png`;
  if (code >= 61 && code <= 67) return `https://openweathermap.org/img/wn/10${prefixoHora}@2x.png`;
  if (code >= 71 && code <= 77) return `https://openweathermap.org/img/wn/13d@2x.png`;
  if (code >= 80 && code <= 82) return `https://openweathermap.org/img/wn/09d@2x.png`;
  if (code >= 85 && code <= 86) return `https://openweathermap.org/img/wn/13d@2x.png`;
  if (code >= 95 && code <= 99) return `https://openweathermap.org/img/wn/11d@2x.png`;
  
  return `https://openweathermap.org/img/wn/03d@2x.png`;
}

function obterClima() {
  const lat = -22.18;
  const lon = -47.38;
  const urlClima = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=America%2FSao_Paulo`;

  fetch(urlClima)
    .then(r => r.json())
    .then(dados => {
      if(dados && dados.current) {
        const temp = Math.round(dados.current.temperature_2m);
        const code = dados.current.weather_code;
        const isDay = dados.current.is_day === 1;

        const tempElement = document.getElementById("temp");
        const iconeElement = document.getElementById("icone");

        if(tempElement) tempElement.innerText = `${temp}°C`;
        if(iconeElement) {
          iconeElement.src = obterIconeClima(code, isDay);
          iconeElement.style.display = "block";
        }
      }
    })
    .catch(() => {});
}
obterClima();
setInterval(obterClima, 600000);
</script>
